[package]
name = "spacewiz"
version = "0.1.0"
edition = "2024"
description = "Disk space analyzer for Windows with an interactive sunburst chart and treemap"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
drag = "2.1.1"
eframe = "0.37.0"
log = "0.4.35"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.15"
tiny-skia = "0.12.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# The scanner is far too slow unoptimized; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3
